# Publishes the site to GitHub Pages on every change to main:
# https://dosmanoff.github.io/study-quest/
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every topic's questions
        run: node tests/generators.test.mjs
      - name: Check the Home Assistant package
        run: |
          pip install --quiet jinja2 pyyaml
          python3 tests/homeassistant_test.py
      - name: Build
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
